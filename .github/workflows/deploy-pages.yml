name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyC94HltbFWwI2qxg8B9_3XmRQFs5tOxAaw
      VITE_FIREBASE_APP_ID: 1:540285293235:web:a54868d867dc71dd43d6c6
      VITE_FIREBASE_AUTH_DOMAIN: drop-off-hope.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: drop-off-hope
      VITE_FIREBASE_STORAGE_BUCKET: drop-off-hope.firebasestorage.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
